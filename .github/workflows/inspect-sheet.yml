name: Inspect history sheet (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -o sheet.xlsx -w "HTTP %{http_code} %{content_type}\n" "https://docs.google.com/spreadsheets/d/17bnmYVRkirJ_fUtMc0ZeRNDyMkoHP2D6_RKWMR3dMkU/export?format=xlsx"
          pip install -q openpyxl
          python3 - <<'PY'
          import openpyxl, csv, sys
          try:
              wb = openpyxl.load_workbook('sheet.xlsx', data_only=True)
          except Exception as e:
              print('Could not open sheet (is link sharing on?):', e); sys.exit(1)
          for ws in wb.worksheets:
              print(f'=== SHEET: {ws.title} ({ws.max_row} rows x {ws.max_column} cols)')
              w = csv.writer(sys.stdout)
              for row in ws.iter_rows(max_row=80, values_only=True):
                  if any(c is not None for c in row):
                      w.writerow(['' if c is None else c for c in row])
          PY
