name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily at 11:00 UTC (~6-7am ET): picks up final scores, including after MNF.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      yahoo_code:
        description: One-time Yahoo login code (only needed to connect Yahoo)
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Skipped automatically until Yahoo is connected (see docs/YAHOO.md).
      - name: Sync from Yahoo
        run: node scripts/yahoo-sync.mjs
        env:
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_AUTH_CODE: ${{ inputs.yahoo_code }}
      - name: Save synced data
        run: |
          if [ -n "$(git status --porcelain src/data .yahoo)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data
            if [ -d .yahoo ]; then git add .yahoo; fi
            git commit -m "Sync league data from Yahoo"
            git pull --rebase origin main
            git push
          fi

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
